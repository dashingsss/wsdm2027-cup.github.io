# Local development settings. Organizers use their own configuration for evaluation.
# Changes take effect on the next launch; no image rebuild is needed.
# Fill in base_url and name before running tasks. OpenAI denotes the compatible
# Chat Completions protocol, not a required vendor. Keep credentials outside YAML.
model:
  provider: OpenAI  # OpenAI-compatible protocol
  base_url: ""  # Your provider's API URL, e.g. https://openrouter.ai/api/v1
  name: ""  # Qwen3.5-9B ID on your provider, e.g. qwen/qwen3.5-9b
  temperature: 0.0
  max_tokens: 2048
  request_timeout_seconds: 120
  api_key_env: MODEL_API_KEY
  extra_body: {}  # Optional service/model-specific parameters.
algorithm:
  endpoint: http://algorithm:8765
  options: {}
data:
  seed: 42
limits:
  max_actions: 50
  max_model_calls: 50
  episode_timeout_seconds: 300
output:
  directory: results
